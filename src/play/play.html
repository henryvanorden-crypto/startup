<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TriviaDash HTML</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css" />
  </head>
  <body class="back-dark">
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header class="container-fluid">
      <nav class="navbar fixed-top">
        <a class="navbar-brand" href="index.html">TriviaDash</a>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu class="navbar-nav">
          <li class="nav-item"><a href="index.html" class="nav-link active">Home</a></li>
          <li class="nav-item"><a href="play.html" class="nav-link">Play</a></li>
          <li class="nav-item"><a href="scores.html" class="nav-link">Scores</a></li>
          <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
        </menu>
      </nav>
    </header>

    <main class="container-fluid back-light text-center">
      <div class="players">
        Player
        <span class="player-name">Mystery player</span>
        <div id="player-messages">
          <div class="event"><span class="player-event">Linus</span> started a new game</div>
          <div class="event"><span class="player-event">Tim</span> scored 10</div>
          <div class="event"><span class="system-event">game</span> connected</div>
        </div>
      </div>

      <div class="quiz-header">
        <div>
          <label for="count">Score</label>
          <input type="text" id="count" value="--" readonly />
          <label for="count">/10</label>
        </div>
        <div>
          Timer: <span id="timer">00:00</span>
        </div>
        <div>
          <button type="submit" class="btn but-color">Pause/Play</button>
        </div>
      </div>

      <div class="quiz">
        <p id="quiz-question">
          Question 1: How many days are in a year?
        </p>
        <div class="quiz-answers">
          <label for="radio1">
          <input type="radio" id="radio1" name="varRadio" value="radio1" checked />
          365</label>
          <label for="radio2">
          <input type="radio" id="radio2" name="varRadio" value="radio2" />
          356</label>
          <label for="radio3">
          <input type="radio" id="radio3" name="varRadio" value="radio3" />
          635</label>
          <label for="radio4">
          <input type="radio" id="radio4" name="varRadio" value="radio3" />
          31</label>
        </div>
      </div>
    </main>

    <footer>
      <div class="container-fluid">
        <span class="text-reset">Henry Van Orden</span>
        <a href="https://github.com/henryvanorden-crypto/startup">GitHub</a>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
