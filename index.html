<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TriviaDash HTML</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css" />
  </head>
  <body class="back-dark">
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header class="container-fluid">
      <nav class="navbar fixed-top">
        <a class="navbar-brand" href="index.html">TriviaDash</a>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu class="navbar-nav">
          <li class="nav-item"><a href="index.html" class="nav-link active">Home</a></li>
          <li class="nav-item"><a href="play.html" class="nav-link">Play</a></li>
          <li class="nav-item"><a href="scores.html" class="nav-link">Scores</a></li>
          <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
        </menu>
      </nav>
    </header>

    <main class="back-light">
      <h1>Welcome to TriviaDash</h1>
      <form method="get" action="play.html">
        <div>
          <span>@</span>
          <input type="text" placeholder="your@email.com" />
        </div>
        <div>
          <span>🔒</span>
          <input type="password" placeholder="password" />
        </div>
        <button type="submit" class="but-color">Login</button>
        <button type="submit" class="sec-but">Create</button>
      </form>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Henry Van Orden</span>
      <br />
      <a href="https://github.com/henryvanorden-crypto/startup">GitHub</a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
